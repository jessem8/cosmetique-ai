[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cosmetique-ai-core"
version = "0.2.0"
description = "Shared schemas for the model-free Cosmetique AI website backend."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]
