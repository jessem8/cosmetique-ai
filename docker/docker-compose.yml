name: cosmetique-ai

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  CORS_ORIGINS: ${APP_ORIGIN:?APP_ORIGIN must be set}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
  ARTIFACT_ROOT: /app/artifacts
  COLAB_AI_URL: ${COLAB_AI_URL:?COLAB_AI_URL must be set}
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set}
  AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
  AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-600}
  AI_HEALTH_TIMEOUT_SECONDS: ${AI_HEALTH_TIMEOUT_SECONDS:-5}
  WORKER_ID: worker-1
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
  WORKER_REMOTE_POLL_SECONDS: ${WORKER_REMOTE_POLL_SECONDS:-2.5}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-90}
  WORKER_RETRY_DELAY_SECONDS: ${WORKER_RETRY_DELAY_SECONDS:-10}
  WORKER_JOB_DEADLINE_SECONDS: ${WORKER_JOB_DEADLINE_SECONDS:-1800}

x-backend-build: &backend-build
  context: ..
  dockerfile: docker/Dockerfile.backend

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  migrations:
    build: *backend-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  backend:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [private, edge]

  worker:
    build: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "app.services.worker"]
    environment: *backend-environment
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os; os.kill(1, 0)
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private, edge]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [edge]

volumes:
  postgres_data:
  artifacts_data:

networks:
  private:
    internal: true
  edge:
