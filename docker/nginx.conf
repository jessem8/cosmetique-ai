limit_req_zone $binary_remote_addr zone=auth_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    # Docker can assign the backend a new IP when only that service is recreated.
    # Resolve the service name at request time instead of caching its startup IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream http://backend:8000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_register burst=5 nodelay;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~* \.(?:js|css|svg|woff2?|ttf|ico)$ {
        try_files $uri =404;
        expires 1y;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
